<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Pedidos</title>
<style>
  :root{
    --verde: #1e8449;
    --verde-oscuro: #166638;
    --verde-claro: #eafaf1;
    --borde: #d7f0e0;
    --texto: #1c2b22;
    --gris: #6b7d73;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:#ffffff;
    color:var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px 60px;
  }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
  }

  h1{
    color: var(--verde);
    font-size: 1.5rem;
    margin: 0 0 4px;
  }

  .subtitulo{
    color: var(--gris);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }

  /* Formulario */
  .form-card{
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 18px;
    background: var(--verde-claro);
    margin-bottom: 28px;
  }

  .form-row{
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .form-row > div{
    flex: 1;
    min-width: 220px;
  }

  label{
    display:block;
    font-size: 0.8rem;
    color: var(--verde-oscuro);
    font-weight: 600;
    margin-bottom: 4px;
  }

  input[type="text"], textarea{
    width: 100%;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fff;
    color: var(--texto);
  }

  textarea{
    resize: vertical;
    min-height: 42px;
  }

  input:focus, textarea:focus{
    outline: none;
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(30,132,73,0.15);
  }

  .btn{
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary{
    background: var(--verde);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--verde-oscuro); }

  .btn-outline{
    background: #fff;
    color: var(--verde);
    border: 1px solid var(--verde);
  }
  .btn-outline:hover{ background: var(--verde-claro); }

  /* Panel resumen */
  .panel{
    display:flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .panel-item{
    flex: 1;
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    transition: 0.15s;
  }
  .panel-item.activo{
    background: var(--verde);
    border-color: var(--verde);
  }
  .panel-item.activo .num, .panel-item.activo .lbl{ color: #fff; }

  .panel-item .num{
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--verde);
    display:block;
  }
  .panel-item .lbl{
    font-size: 0.78rem;
    color: var(--gris);
  }

  /* Buscador */
  .buscador{
    margin-bottom: 16px;
  }

  /* Lista de pedidos */
  .pedido{
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
  }

  .pedido.impreso{
    background: var(--verde-claro);
  }

  .pedido-info{
    flex: 1;
    min-width: 0;
  }

  .pedido-nombre{
    font-weight: 700;
    color: var(--texto);
    margin-bottom: 3px;
  }

  .pedido-detalle{
    color: var(--gris);
    font-size: 0.88rem;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .pedido-fecha{
    color: #a7b5ac;
    font-size: 0.72rem;
    margin-top: 4px;
  }

  .pedido-acciones{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toggle-impreso{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1px solid var(--borde);
    color: var(--gris);
    background: #fff;
    white-space: nowrap;
  }

  .toggle-impreso.on{
    background: var(--verde);
    border-color: var(--verde);
    color: #fff;
  }

  .btn-borrar{
    background: none;
    border: none;
    color: #c0392b;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 8px;
    line-height: 1;
    opacity: 0.6;
  }
  .btn-borrar:hover{ opacity: 1; }

  .vacio{
    text-align:center;
    color: var(--gris);
    padding: 40px 10px;
    font-size: 0.9rem;
  }

  @media (max-width: 480px){
    .pedido{ flex-wrap: wrap; }
    .pedido-acciones{ width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Control de Pedidos</h1>
  <p class="subtitulo">Cargá los pedidos de WhatsApp y controlá cuáles ya imprimiste para Correo Argentino.</p>

  <div class="form-card">
    <div class="form-row">
      <div>
        <label for="nombre">Nombre y apellido del cliente</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label for="detalle">Qué compró</label>
        <textarea id="detalle" placeholder="Ej: 2x luces LED RGB + soporte celular"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" onclick="agregarPedido()">+ Agregar pedido</button>
  </div>

  <div class="panel">
    <div class="panel-item activo" data-filtro="todas" onclick="setFiltro('todas')">
      <span class="num" id="cont-todas">0</span>
      <span class="lbl">Todas</span>
    </div>
    <div class="panel-item" data-filtro="pendientes" onclick="setFiltro('pendientes')">
      <span class="num" id="cont-pendientes">0</span>
      <span class="lbl">Pendientes</span>
    </div>
    <div class="panel-item" data-filtro="impresas" onclick="setFiltro('impresas')">
      <span class="num" id="cont-impresas">0</span>
      <span class="lbl">Impresas</span>
    </div>
  </div>

  <div class="buscador">
    <input type="text" id="buscar" placeholder="Buscar por nombre..." oninput="render()">
  </div>

  <div id="lista"></div>
</div>

<script>
  const STORAGE_KEY = 'pedidos_control_v1';
  let filtroActual = 'todas';

  function cargarPedidos(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){
      return [];
    }
  }

  function guardarPedidos(pedidos){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pedidos));
  }

  function agregarPedido(){
    const nombreInput = document.getElementById('nombre');
    const detalleInput = document.getElementById('detalle');
    const nombre = nombreInput.value.trim();
    const detalle = detalleInput.value.trim();

    if(!nombre){
      nombreInput.focus();
      return;
    }

    const pedidos = cargarPedidos();
    pedidos.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      nombre,
      detalle,
      impreso: false,
      fecha: new Date().toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})
    });
    guardarPedidos(pedidos);

    nombreInput.value = '';
    detalleInput.value = '';
    nombreInput.focus();

    render();
  }

  function toggleImpreso(id){
    const pedidos = cargarPedidos();
    const p = pedidos.find(x => x.id === id);
    if(p){ p.impreso = !p.impreso; }
    guardarPedidos(pedidos);
    render();
  }

  function borrarPedido(id){
    if(!confirm('¿Borrar este pedido?')) return;
    let pedidos = cargarPedidos();
    pedidos = pedidos.filter(x => x.id !== id);
    guardarPedidos(pedidos);
    render();
  }

  function setFiltro(f){
    filtroActual = f;
    document.querySelectorAll('.panel-item').forEach(el => {
      el.classList.toggle('activo', el.dataset.filtro === f);
    });
    render();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(){
    const pedidos = cargarPedidos();
    const busqueda = document.getElementById('buscar').value.trim().toLowerCase();

    document.getElementById('cont-todas').textContent = pedidos.length;
    document.getElementById('cont-pendientes').textContent = pedidos.filter(p => !p.impreso).length;
    document.getElementById('cont-impresas').textContent = pedidos.filter(p => p.impreso).length;

    let filtrados = pedidos;
    if(filtroActual === 'pendientes') filtrados = pedidos.filter(p => !p.impreso);
    if(filtroActual === 'impresas') filtrados = pedidos.filter(p => p.impreso);
    if(busqueda){
      filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(busqueda));
    }

    const lista = document.getElementById('lista');

    if(filtrados.length === 0){
      lista.innerHTML = `<div class="vacio">No hay pedidos para mostrar.</div>`;
      return;
    }

    lista.innerHTML = filtrados.map(p => `
      <div class="pedido ${p.impreso ? 'impreso' : ''}">
        <div class="pedido-info">
          <div class="pedido-nombre">${escapeHtml(p.nombre)}</div>
          ${p.detalle ? `<div class="pedido-detalle">${escapeHtml(p.detalle)}</div>` : ''}
          <div class="pedido-fecha">${p.fecha}</div>
        </div>
        <div class="pedido-acciones">
          <div class="toggle-impreso ${p.impreso ? 'on' : ''}" onclick="toggleImpreso('${p.id}')">
            ${p.impreso ? '✓ Impreso' : 'Marcar impreso'}
          </div>
          <button class="btn-borrar" onclick="borrarPedido('${p.id}')" title="Borrar">✕</button>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('nombre').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('detalle').focus(); }
  });
  document.getElementById('detalle').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); agregarPedido(); }
  });

  render();
</script>

</body>
</html>
